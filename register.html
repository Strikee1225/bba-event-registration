<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | BBA Event Hub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            BBA Event Hub
        </div>

        <ul class="nav-links">

            <li><a href="/">Home</a></li>

            <li><a href="/events">Events</a></li>

            <li><a href="/about">About</a></li>

            <li><a href="/contact">Contact</a></li>

        </ul>

    </nav>


    <!-- Registration Section -->
    <section class="section">

        <div style="max-width: 700px; margin: auto;">

            <a href="/event/{{ event._id }}"
               style="text-decoration: none; color: #2386c8;">

                ← Back to Event

            </a>


            <div class="event-card" style="margin-top: 30px;">

                <div class="event-info">

                    <span class="category">
                        {{ event.category }}
                    </span>

                    <h1 style="color: #1e6fa8; margin: 15px 0;">

                        Register for {{ event.title }}

                    </h1>

                    <p style="color: #637585; margin-bottom: 25px;">

                        Please fill in your information to register
                        for this event.

                    </p>


                    <!-- Registration Form -->

                    <form method="POST">


                        <!-- Full Name -->

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            required
                            placeholder="Enter your full name"
                            style="width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #dce6ee; border-radius: 8px;"
                        >


                        <!-- Student ID -->

                        <label>
                            Student ID
                        </label>

                        <input
                            type="text"
                            name="student_id"
                            required
                            placeholder="Enter your student ID"
                            style="width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #dce6ee; border-radius: 8px;"
                        >


                        <!-- Email -->

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            required
                            placeholder="Enter your email"
                            style="width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #dce6ee; border-radius: 8px;"
                        >


                        <!-- Phone -->

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            required
                            placeholder="Enter your phone number"
                            style="width: 100%; padding: 12px; margin: 8px 0 25px; border: 1px solid #dce6ee; border-radius: 8px;"
                        >


                        <!-- Submit -->

                        <button
                            type="submit"
                            class="btn"
                            style="border: none; cursor: pointer;">

                            Submit Registration

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->

    <footer class="footer">

        <p>© 2026 BBA Event Hub</p>

        <p>BBA International Program</p>

    </footer>

</body>

</html>
