<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | BBA Event Hub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">BBA Event Hub</div>

        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/events">Events</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>


    <header class="page-header">
        <h1>Contact Us</h1>
        <p>Have a question? We'd love to hear from you.</p>
    </header>


    <section class="section">

        <div style="max-width: 900px; margin: auto;">

            <div class="event-grid">

                <!-- Contact Information -->
                <div class="event-card">
                    <div class="event-info">

                        <h2 style="color: #2386c8; margin-bottom: 20px;">
                            Get in Touch
                        </h2>

                        <p>
                            📧 <strong>Email</strong>
                        </p>

                        <p style="margin-bottom: 20px;">
                            bba.eventhub@university.ac.th
                        </p>

                        <p>
                            📍 <strong>Location</strong>
                        </p>

                        <p style="margin-bottom: 20px;">
                            TSU International College
                        </p>

                        <p>
                            📞 <strong>Phone</strong>
                        </p>

                        <p>
                            +66 74 000 000
                        </p>

                    </div>
                </div>


                <!-- Contact Form -->
                <div class="event-card">
                    <div class="event-info">

                        <h2 style="color: #2386c8; margin-bottom: 20px;">
                            Send a Message
                        </h2>

                        <form onsubmit="sendMessage(event)">

                            <label>Name</label>

                            <input
                                type="text"
                                required
                                placeholder="Your name"
                                style="width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #dce6ee; border-radius: 8px;"
                            >


                            <label>Email</label>

                            <input
                                type="email"
                                required
                                placeholder="Your email"
                                style="width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #dce6ee; border-radius: 8px;"
                            >


                            <label>Message</label>

                            <textarea
                                required
                                placeholder="Write your message..."
                                rows="5"
                                style="width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #dce6ee; border-radius: 8px; resize: vertical;"
                            ></textarea>


                            <button type="submit" class="btn">
                                Send Message
                            </button>

                        </form>

                    </div>
                </div>

            </div>

        </div>

    </section>


    <footer class="footer">

        <p>© 2026 BBA Event Hub</p>
        <p>BBA International Program</p>

    </footer>


    <script>
        function sendMessage(event) {

            event.preventDefault();

            alert("Your message has been sent successfully!");

        }
    </script>

</body>
</html>
<form method="POST" action="/contact">

    <label>Name</label>
    <input
        type="text"
        name="name"
        placeholder="Your name"
        required
    >

    <label>Email</label>
    <input
        type="email"
        name="email"
        placeholder="Your email"
        required
    >

    <label>Message</label>
    <textarea
        name="message"
        placeholder="Write your message..."
        required
    ></textarea>

    <button type="submit" class="btn-primary">
        Send Message
    </button>

</form>
